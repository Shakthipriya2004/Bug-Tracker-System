spring.application.name=bug-tracker

# MySQL database connection.
# If you use XAMPP/WAMP, root often has no password, so this is intentionally blank.
spring.datasource.url=jdbc:mysql://localhost:3306/bugtracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring/JPA settings.
# update creates or updates the table structure without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
